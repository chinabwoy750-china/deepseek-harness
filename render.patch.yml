# Render deployment overlay.
# Render requires public web services to bind to 0.0.0.0. The normal DSH Web
# CLI intentionally rejects --host 0.0.0.0, so this deployment overlay changes
# only the composed server binding and port without weakening the CLI safety check.
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.PORT || 10000)
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
